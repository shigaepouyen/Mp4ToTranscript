[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mp4-to-transcript"
version = "0.1.0"
description = "CLI pour transcrire des fichiers audio/video en texte via Whisper."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mlx-whisper",
    "rich",
]

[project.optional-dependencies]
desktop = ["PySide6==6.8.3"]
diarization = [
    "pyannote.audio",
]

[project.scripts]
mp4-to-transcript = "mp4_to_transcript.cli:main"
mp4-to-transcript-app = "mp4_to_transcript.desktop:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mp4_to_transcript*"]

[tool.setuptools.package-data]
mp4_to_transcript = ["assets/*.svg", "assets/*.png", "assets/*.icns"]
